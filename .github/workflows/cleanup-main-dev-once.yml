name: Einmalige Branch-Bereinigung auf main und dev
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-main-dev-once.yml']
permissions: {}
concurrency:
  group: einmalige-branch-bereinigung
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Philipp284868/Leitstellen-Verbund'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Integrierte Commit-Historie prüfen und nur die drei freigegebenen Altbranches entfernen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const repository = 'Philipp284868/Leitstellen-Verbund';
          if (process.env.GITHUB_REPOSITORY !== repository || process.env.GITHUB_REF !== 'refs/heads/main') {
            throw new Error('Falsches Repository oder falscher Branch. Keine Änderungen.');
          }
          const candidates = [
            ['feature/amp-authoritative-server', 'e65a3c4277dbeda805e1040e072f76712afe8645'],
            ['feature/amp-einfachstart', '2d9cdd22abf96111f2f1446d9ee1c539b50ebd43'],
            ['feature/leitstellen-verbund', 'b7848b96f20d9ed16b94cb79c4fd13166237f194'],
          ];
          async function api(path, method = 'GET', allowMissing = false) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              method,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              signal: AbortSignal.timeout(20000),
            });
            if (allowMissing && response.status === 404) return null;
            if (!response.ok) throw new Error(`${method} ${path}: HTTP ${response.status}. Keine Berechtigungen umgehen.`);
            return response.status === 204 ? null : response.json();
          }
          const refPath = (name) => '/git/ref/heads/' + name.split('/').map(encodeURIComponent).join('/');
          const currentMain = await api(refPath('main'));
          const currentDev = await api(refPath('dev'));
          if (currentMain.object.sha !== process.env.GITHUB_SHA) throw new Error('main wurde zwischenzeitlich geändert. Abbruch.');
          const compare = await api(`/compare/${currentMain.object.sha}...${currentDev.object.sha}?per_page=1`);
          if (!['behind', 'identical'].includes(compare.status)) throw new Error('dev enthält abweichende Arbeit. Abbruch.');
          const pulls = await api('/pulls?state=open&per_page=100');
          if (pulls.length) throw new Error('Es gibt noch offene Pull Requests. Zuerst Änderungen integrieren.');
          const ready = [];
          for (const [name, sha] of candidates) {
            if (['main', 'dev'].includes(name)) throw new Error('Geschützter Zielbranch in Löschliste.');
            const branch = await api(refPath(name), 'GET', true);
            if (!branch) { console.log(`${name}: bereits entfernt.`); continue; }
            if (branch.object.sha !== sha) throw new Error(`${name}: neue Commits entdeckt. Abbruch ohne deren Löschung.`);
            const integrated = await api(`/compare/${currentMain.object.sha}...${sha}?per_page=1`);
            if (!['behind', 'identical'].includes(integrated.status) || integrated.merge_base_commit.sha !== sha) {
              throw new Error(`${name}: nicht vollständig in main enthalten. Keine Löschung.`);
            }
            ready.push([name, sha]);
          }
          for (const [name, sha] of ready) {
            const branch = await api(refPath(name));
            const main = await api(refPath('main'));
            if (branch.object.sha !== sha || main.object.sha !== currentMain.object.sha) {
              throw new Error('Repository wurde während der Prüfung verändert. Abbruch.');
            }
            await api('/git/refs/heads/' + name.split('/').map(encodeURIComponent).join('/'), 'DELETE');
            console.log(`${name}: entfernt; alle Commits bleiben über main erhalten.`);
          }
          const branches = await api('/branches?per_page=100');
          const names = branches.map((b) => b.name).sort();
          if (JSON.stringify(names) !== JSON.stringify(['dev', 'main'])) {
            throw new Error('Unerwartete weitere Branches. Keine pauschale Löschung.');
          }
          console.log('Geprüft: ausschließlich main und dev vorhanden; kein offener Pull Request.');
          NODE
