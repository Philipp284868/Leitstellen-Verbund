name: Prüfung
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Prüfprofil (auto wählt konservativ anhand der Änderungen)
        type: choice
        options: [auto, fast, full, deep]
        default: full
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .tools/pnpm-11.19.0/pnpm.tgz
          key: pnpm-verified-11.19.0
      - name: Einmalige Installation des geprüften Werkzeugstands
        run: node scripts/amp-setup.mjs --install-only
        env:
          NODE_ENV: production
      - id: plan
        name: Ausgangscommit, Pflichtumfang und gewichtete Shards
        run: node scripts/ci-plan.mjs
        env:
          CI_PROFILE: ${{ inputs.profile || 'auto' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-plan
          path: .tools/ci/plan.json
          include-hidden-files: true
          retention-days: 14
      - run: node scripts/ci-run.mjs structure
      - name: Ein Deutschland-Build einschließlich Typen und Bundlebudgets
        if: steps.plan.outputs.profile != 'docs'
        run: node scripts/ci-run.mjs build
      - name: Geprüfte Ausgabe und Werkzeuge an Folgejobs übergeben
        if: steps.plan.outputs.profile != 'docs'
        run: tar -czf /tmp/verified-build.tgz dist node_modules .tools/pnpm-11.19.0 .tools/ci/plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.plan.outputs.profile != 'docs' && success()
        with:
          name: verified-build
          path: /tmp/verified-build.tgz
          retention-days: 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-prepare
          path: .tools/ci/results/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  logic:
    needs: prepare
    if: needs.prepare.outputs.profile != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-build
          path: /tmp/verified-build
      - run: tar -xzf /tmp/verified-build/verified-build.tgz
      - run: node scripts/check-build-provenance.mjs
      - run: node scripts/ci-run.mjs logic
      - if: needs.prepare.outputs.full == 'true'
        run: node scripts/ci-run.mjs node
      - if: needs.prepare.outputs.full == 'true'
        run: node scripts/ci-run.mjs audit
      - if: needs.prepare.outputs.full == 'true'
        run: node scripts/ci-run.mjs package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: needs.prepare.outputs.full == 'true' && success()
        with:
          name: linux-runtime-candidate
          path: .tools/releases/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-logic
          path: .tools/ci/results/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: logic-test-metrics
          path: .tools/test-runs/
          include-hidden-files: true
          retention-days: 14
  browser:
    needs: prepare
    if: needs.prepare.outputs.profile != 'docs'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-build
          path: /tmp/verified-build
      - run: tar -xzf /tmp/verified-build/verified-build.tgz
      - run: node scripts/check-build-provenance.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ runner.arch }}-${{ matrix.engine }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Browserabhängigkeiten und lokales Audiogerät
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo install -d /etc/apt/lv-sources
          sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/lv-sources/ubuntu.sources
          printf 'Dir::Etc::sourcelist "-";\nDir::Etc::sourceparts "/etc/apt/lv-sources";\n' | sudo tee /etc/apt/apt.conf.d/99-lv-sources
          node node_modules/@playwright/test/cli.js install --with-deps ${{ matrix.engine }}
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils xvfb libgl1-mesa-dri
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
      - name: Geplante Browserdateien genau einmal ausführen
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/ci-run.mjs ${{ matrix.engine }} ${{ matrix.part }}
        env:
          LV_CI_SOFTWARE_GL: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-${{ matrix.engine }}-${{ matrix.part }}
          path: .tools/ci/results/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-${{ matrix.engine }}-${{ matrix.part }}
          path: |
            .tools/test-runs/
            .tools/ci/browser-output/
          include-hidden-files: true
          retention-days: 7
  geodata:
    needs: prepare
    if: needs.prepare.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEODATA_DIR: /tmp/leitstellen-geodata-fixtures
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-build
          path: /tmp/verified-build
      - run: tar -xzf /tmp/verified-build/verified-build.tgz
      - run: node scripts/check-build-provenance.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/geodata/dem/requirements.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.GEODATA_DIR }}/tools
          key: geotools-${{ runner.os }}-${{ hashFiles('scripts/geodata/pipeline.mjs', 'scripts/geodata/dem/requirements.lock') }}
      - run: node scripts/ci-run.mjs geodata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-geodata
          path: .tools/ci/results/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  endurance:
    needs: prepare
    if: needs.prepare.outputs.profile == 'deep'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-build
          path: /tmp/verified-build
      - run: tar -xzf /tmp/verified-build/verified-build.tgz
      - run: node scripts/check-build-provenance.mjs
      - name: Beide unterstützten Engines für isolierte Lastprüfung
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox
          sudo apt-get install --no-install-recommends -y xvfb libgl1-mesa-dri
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/ci-run.mjs endurance
        env:
          LV_CI_SOFTWARE_GL: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-endurance
          path: .tools/ci/results/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: endurance-metrics
          path: |
            .tools/test-runs/
            .tools/ci/browser-output/
          include-hidden-files: true
          retention-days: 7
  amp:
    needs: prepare
    if: needs.prepare.outputs.full == 'true'
    runs-on: ubuntu-latest
    container: node:24.19.0-trixie
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-build
          path: /tmp/verified-build
      - run: tar -xzf /tmp/verified-build/verified-build.tgz
      - name: Frische Installation, Wiederherstellung und echter TLS-Proxy unter Debian 13
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/ci-run.mjs amp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: results-amp
          path: .tools/ci/results/amp.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: amp-acceptance
          path: .tools/amp-acceptance/result.json
          include-hidden-files: true
          retention-days: 14
  acceptance:
    name: Verbindliche Produktabnahme
    needs: [prepare, logic, browser, geodata, endurance, amp]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: product-plan
          path: .tools/ci/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: results-*
          merge-multiple: true
          path: .tools/ci/collected/
      - name: Geplanten Umfang und tatsächliche Ergebnisse vollständig abgleichen
        run: node scripts/ci-aggregate.mjs
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-acceptance
          path: .tools/ci/acceptance.json
          include-hidden-files: true
          retention-days: 30
