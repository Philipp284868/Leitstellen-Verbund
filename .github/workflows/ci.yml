name: Prüfung
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: AMP-Setup ohne vorhandene Projektabhängigkeiten
        run: node scripts/amp-setup.mjs
        env:
          NODE_ENV: production
      - run: node .tools/pnpm-11.19.0/bin/pnpm.cjs typecheck
      - run: node .tools/pnpm-11.19.0/bin/pnpm.cjs lint
      - run: node .tools/pnpm-11.19.0/bin/pnpm.cjs test
      - run: node .tools/pnpm-11.19.0/bin/pnpm.cjs exec playwright install --with-deps chromium firefox
      - name: Virtuelles Audiogerät für echte Browser-Audioausgabe
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl info
      - run: node .tools/pnpm-11.19.0/bin/pnpm.cjs test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amp-browser-testbericht
          path: playwright-report/
          retention-days: 14
