name: Prüfung
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geodata-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEODATA_DIR: /tmp/leitstellen-geodata-fixtures
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/geodata/dem/requirements.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.GEODATA_DIR }}/tools
          key: geotools-${{ runner.os }}-${{ hashFiles('scripts/geodata/pipeline.mjs', 'scripts/geodata/dem/requirements.lock') }}
      - name: Geprüfte Werkzeuge ohne Download des Deutschlanddatensatzes
        run: node scripts/geodata/pipeline.mjs tools
      - name: Unterbrochene JDK-Installation mit echtem Archiv reparieren
        run: node scripts/geodata/test-tools.mjs
      - name: Echter OSM-Parser mit kleiner bekannter Topologie
        run: node scripts/geodata/test-index.mjs
      - name: Höhenkodierung, Quellenbindung, Geometrie und Resume-Schutz
        run: |
          python -m pip install --require-hashes --only-binary=:all: --target "$GEODATA_DIR/tools/dem-python" -r scripts/geodata/dem/requirements.lock
          python scripts/geodata/dem/test_dem.py
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Kaltes AMP-Setup und Produktionsbuild
        run: node scripts/amp-setup.mjs
        env:
          NODE_ENV: production
      - name: Build und Testwerkzeuge für denselben Commit bündeln
        run: tar -czf /tmp/verified-build.tgz dist node_modules .tools/pnpm-11.19.0 .tools/test-runs/build.json .tools/test-runs/bundles.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-build
          path: /tmp/verified-build.tgz
          retention-days: 2
  build-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-build
          path: /tmp/verified-build
      - run: tar -xzf /tmp/verified-build/verified-build.tgz
      - run: node scripts/check-build-provenance.mjs
      - run: node .tools/pnpm-11.19.0/bin/pnpm.cjs check:project
      - run: node .tools/pnpm-11.19.0/bin/pnpm.cjs lint
      - name: Vollständige Logik-, Sicherheits-, Migrations- und Betriebstests
        run: node .tools/pnpm-11.19.0/bin/pnpm.cjs test:ci
      - name: Produktionsabhängigkeiten auf bekannte hohe Risiken prüfen
        run: node .tools/pnpm-11.19.0/bin/pnpm.cjs test:security
      - name: Startfähiges Linux-Paket und reproduzierbare Verpackung
        run: |
          node scripts/package-runtime.mjs
          cp .tools/releases/SHA256SUMS /tmp/first-runtime-sha
          node scripts/package-runtime.mjs
          cmp /tmp/first-runtime-sha .tools/releases/SHA256SUMS
          node scripts/runtime-smoke.mjs .tools/releases/leitstellen-verbund-*-linux-runtime.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-runtime-candidate
          path: .tools/releases/
          include-hidden-files: true
          retention-days: 14
      - name: Testumfang und Laufzeit
        if: always()
        run: node scripts/ci-summary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: logic-test-metrics
          path: .tools/test-runs/
          include-hidden-files: true
          retention-days: 14
  browser:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Firefox software rendering completed all 37 normal shard-2 cases in
    # 10.5 minutes; leave time for setup and the unchanged isolated load test.
    timeout-minutes: ${{ matrix.browser == 'firefox' && 18 || 12 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-build
          path: /tmp/verified-build
      - run: tar -xzf /tmp/verified-build/verified-build.tgz
      - run: node scripts/check-build-provenance.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Ubuntu-Systempakete ohne unbenötigte Drittanbieterquellen
        # Playwright supplies its own browsers. A broken preinstalled Chrome
        # repository must not block Ubuntu libraries; signature/hash checks stay on.
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo install -d /etc/apt/lv-sources
          sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/lv-sources/ubuntu.sources
          printf 'Dir::Etc::sourcelist "-";\nDir::Etc::sourceparts "/etc/apt/lv-sources";\n' | sudo tee /etc/apt/apt.conf.d/99-lv-sources
      - name: Desktop-Browser und Systemabhängigkeiten
        run: node .tools/pnpm-11.19.0/bin/pnpm.cjs exec playwright install --with-deps ${{ matrix.browser }}
      - name: Echtes virtuelles Audiogerät
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils xvfb libgl1-mesa-dri
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
      - name: Desktop-Abläufe parallel, Lastmessung anschließend isoliert
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node .tools/pnpm-11.19.0/bin/pnpm.cjs test:e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
        env:
          LV_CI_SOFTWARE_GL: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Testumfang und Laufzeit
        if: always()
        run: node scripts/ci-summary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            .tools/test-runs/
            .tools/screenshots/
          include-hidden-files: true
          retention-days: 7
